<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0d4a46"/>
      <stop offset="45%" stop-color="#062826"/>
      <stop offset="100%" stop-color="#021110"/>
    </radialGradient>

    <!-- Emerald Metallic Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gold Luxury Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cross Crystal Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e6fffa"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)"/>

  <!-- Inner Concentric Golden Rings -->
  <circle cx="256" cy="235" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="14 7"/>
  <circle cx="256" cy="235" r="176" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Precision Medical Cross -->
  <g filter="url(#shadowDepth)">
    <path d="M 204 85 L 308 85 A 14 14 0 0 1 322 99 L 322 181 A 12 12 0 0 0 334 193 L 416 193 A 14 14 0 0 1 430 207 L 430 311 A 14 14 0 0 1 416 325 L 334 325 A 12 12 0 0 0 322 337 L 322 419 A 14 14 0 0 1 308 433 L 204 433 A 14 14 0 0 1 190 419 L 190 337 A 12 12 0 0 0 178 325 L 96 325 A 14 14 0 0 1 82 311 L 82 207 A 14 14 0 0 1 96 193 L 178 193 A 12 12 0 0 0 190 181 L 190 99 A 14 14 0 0 1 204 85 Z"
          fill="url(#crossGrad)"/>
    <!-- Subtle Inner Border for 3D Pop -->
    <path d="M 204 85 L 308 85 A 14 14 0 0 1 322 99 L 322 181 A 12 12 0 0 0 334 193 L 416 193 A 14 14 0 0 1 430 207 L 430 311 A 14 14 0 0 1 416 325 L 334 325 A 12 12 0 0 0 322 337 L 322 419 A 14 14 0 0 1 308 433 L 204 433 A 14 14 0 0 1 190 419 L 190 337 A 12 12 0 0 0 178 325 L 96 325 A 14 14 0 0 1 82 311 L 82 207 A 14 14 0 0 1 96 193 L 178 193 A 12 12 0 0 0 190 181 L 190 99 A 14 14 0 0 1 204 85 Z"
          fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Veterinary Centerpiece: Stylized Noble Stallion & Medical Rod -->
  <!-- Central Caduceus Staff -->
  <line x1="256" y1="120" x2="256" y2="380" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Golden Sphere Top -->
  <circle cx="256" cy="116" r="15" fill="url(#goldGrad)"/>
  <circle cx="256" cy="116" r="6" fill="#ffffff"/>

  <!-- Left: Noble Stallion Profile in Emerald Green -->
  <path d="M 210 160 C 235 152 250 168 250 192 C 250 216 232 232 216 238 C 196 244 178 262 172 292 C 166 262 174 232 188 212 C 198 198 192 178 180 170 C 194 164 204 162 210 160 Z"
        fill="url(#emeraldGrad)"/>

  <!-- Right: Healing Serpent & Heart Curve -->
  <path d="M 256 160 C 290 155 296 200 265 220 C 230 242 236 295 275 310 C 295 318 290 350 268 368"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized Animal Care Paw Dot / Leaf Accent on Right -->
  <ellipse cx="302" cy="245" rx="14" ry="20" fill="url(#emeraldGrad)" transform="rotate(22 302 245)"/>
  <circle cx="324" cy="225" r="7" fill="url(#emeraldGrad)"/>
  <circle cx="332" cy="245" r="6.5" fill="url(#emeraldGrad)"/>

  <!-- Luxury Brand Badge on Bottom -->
  <g transform="translate(0, 8)">
    <rect x="100" y="394" width="312" height="56" rx="16" fill="#031615" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadowDepth)"/>
    
    <!-- Gold Star Crown -->
    <path d="M 256 384 L 260 393 L 270 394 L 262 400 L 265 410 L 256 404 L 247 410 L 250 400 L 242 394 L 252 393 Z" fill="url(#goldGrad)"/>

    <!-- Typography -->
    <text x="256" y="427" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">MANSOUR</text>
    <text x="256" y="443" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif" font-size="10" font-weight="700" fill="#5eead4" letter-spacing="3.5">VET PHARMACY</text>
  </g>
</svg>
